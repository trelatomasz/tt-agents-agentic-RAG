name: Branch Flow Policy Enforcement

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]

jobs:
  validate-branch-flow:
    name: Validate PR Branch Flow
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR source branch targeting main
        if: github.base_ref == 'main'
        run: |
          echo "Target branch is 'main'."
          echo "Source branch (head_ref) is '${{ github.head_ref }}'."
          if [ "${{ github.head_ref }}" == "main" ]; then
            echo "::error::PRs from 'main' into 'main' are invalid."
            exit 1
          fi
          echo "PR source branch '${{ github.head_ref }}' is valid for target 'main' under Trunk-Based Development."
