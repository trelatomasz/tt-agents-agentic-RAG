[project]
name = "gpc-parts-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.116,<1", "google-cloud-storage>=3.2,<4", "google-genai>=1.30,<2", "pydantic-settings>=2.10,<3", "uvicorn[standard]>=0.35,<1"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
